<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f2f7; color: #1a1a1a; min-height: 100vh; }

  .header { background: #1a1a2e; color: white; padding: 1rem 1.25rem; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 1.15rem; font-weight: 700; }

  .tabs { display: flex; background: #16213e; position: sticky; top: 56px; z-index: 9; }
  .tab-btn { flex: 1; padding: 0.8rem 0.5rem; color: #8899aa; border: none; background: none; font-size: 0.875rem; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; }
  .tab-btn.active { color: #fff; border-bottom-color: #e94560; }

  .page { display: none; max-width: 680px; margin: 0 auto; padding: 1.25rem; }
  .page.active { display: block; }

  /* Upload */
  .card { background: white; border-radius: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); overflow: hidden; margin-bottom: 1.25rem; }
  .card-body { padding: 1.5rem; }

  .drop-zone { border: 2px dashed #d1d1d6; border-radius: 10px; padding: 2.25rem 1rem; text-align: center; cursor: pointer; position: relative; transition: all 0.2s; margin-bottom: 1.25rem; }
  .drop-zone.has-file { border-color: #e94560; background: #fff5f7; }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .drop-icon { font-size: 2.5rem; margin-bottom: 0.6rem; }
  .drop-label { font-size: 0.9rem; color: #555; line-height: 1.4; }
  .drop-filename { font-size: 0.85rem; color: #e94560; font-weight: 600; margin-top: 0.4rem; }

  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 0.8rem; font-weight: 600; color: #666; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input { width: 100%; border: 1px solid #d1d1d6; border-radius: 8px; padding: 0.55rem 0.8rem; font-size: 0.95rem; }

  .btn { display: block; width: 100%; padding: 0.85rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; text-align: center; transition: all 0.15s; }
  .btn-red { background: #e94560; color: white; }
  .btn-red:hover:not(:disabled) { background: #c73652; }
  .btn-red:disabled { background: #ccc; cursor: default; }

  .status-box { margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.875rem; line-height: 1.4; }
  .status-box.loading { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }
  .status-box.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .status-box.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

  /* Receipt result */
  .result-header { background: #1a1a2e; color: white; padding: 1rem 1.25rem; }
  .result-header h3 { font-size: 1rem; font-weight: 700; }
  .result-header p { font-size: 0.8rem; opacity: 0.65; margin-top: 0.2rem; }
  .pills-row { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.85rem 1.25rem; border-bottom: 1px solid #f2f2f7; }
  .pill { border-radius: 20px; padding: 0.22rem 0.65rem; font-size: 0.75rem; font-weight: 700; color: white; }
  .items-table { width: 100%; border-collapse: collapse; }
  .items-table th { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.55rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
  .items-table td { padding: 0.5rem 1rem; border-bottom: 1px solid #f8f8f8; font-size: 0.85rem; }
  .items-table td:last-child { text-align: right; font-weight: 600; }

  /* History */
  .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.1rem; background: white; border-radius: 12px; margin-bottom: 0.6rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .hist-store { font-weight: 600; font-size: 0.9rem; }
  .hist-meta { font-size: 0.75rem; color: #888; margin-top: 0.15rem; }
  .hist-total { font-weight: 700; font-size: 1rem; color: #1a1a2e; }

  /* Dashboard */
  .month-card { background: white; border-radius: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); margin-bottom: 1.5rem; overflow: hidden; }
  .month-head { background: #1a1a2e; color: white; padding: 0.9rem 1.25rem; display: flex; justify-content: space-between; align-items: center; }
  .month-head h2 { font-size: 1rem; font-weight: 700; }
  .month-head .month-total { font-size: 1.1rem; font-weight: 700; color: #e94560; }
  .section-title { font-size: 0.7rem; font-weight: 700; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.9rem 1.25rem 0.4rem; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 1.25rem 1rem; }
  .cat-chip { border-radius: 8px; padding: 0.3rem 0.8rem; font-size: 0.8rem; color: white; font-weight: 600; }
  .items-body { padding: 0 1.25rem 1rem; }
  .item-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0; border-bottom: 1px solid #f8f8f8; }
  .item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .item-name { flex: 1; font-size: 0.85rem; text-transform: capitalize; }
  .bar-wrap { width: 80px; }
  .bar { height: 6px; border-radius: 3px; min-width: 3px; }
  .item-amt { font-size: 0.85rem; font-weight: 700; width: 52px; text-align: right; }

  .empty { text-align: center; padding: 3rem 1rem; color: #8e8e93; }
  .empty .empty-icon { font-size: 3rem; margin-bottom: 0.75rem; }
  .empty p { font-size: 0.9rem; line-height: 1.6; }

  @media (max-width: 480px) {
    .page { padding: 1rem; }
    .card-body { padding: 1.1rem; }
  }
</style>
</head>
<body>

<div class="header"><h1>🧾 Receipt Scanner</h1></div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('upload')">Upload</button>
  <button class="tab-btn" onclick="showTab('history')">History</button>
  <button class="tab-btn" onclick="showTab('dashboard')">Dashboard</button>
</div>

<!-- UPLOAD TAB -->
<div id="page-upload" class="page active">
  <div class="card">
    <div class="card-body">
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="image/*" capture="environment" onchange="onFileSelect(this)">
        <div class="drop-icon">📷</div>
        <div class="drop-label">Tap to take a photo or choose from library</div>
        <div class="drop-filename" id="filename"></div>
      </div>
      <div class="field">
        <label>Date override <span style="font-weight:400;text-transform:none">(optional — leave blank to read from receipt)</span></label>
        <input type="date" id="date-input">
      </div>
      <button class="btn btn-red" id="scan-btn" onclick="scanReceipt()" disabled>Scan Receipt</button>
      <div id="status-box" style="display:none" class="status-box"></div>
    </div>
  </div>
  <div id="result-area"></div>
</div>

<!-- HISTORY TAB -->
<div id="page-history" class="page">
  <div id="history-list"></div>
</div>

<!-- DASHBOARD TAB -->
<div id="page-dashboard" class="page">
  <div id="dashboard-content"></div>
</div>

<script>
const COLORS = {
  Protein:'#e74c3c', Grains:'#e67e22', Vegetables:'#27ae60',
  Fruits:'#f39c12', Dairy:'#3498db', Beverages:'#9b59b6',
  Snacks:'#e91e63', Household:'#607d8b', Other:'#95a5a6'
};

let selectedFile = null;
let receipts = [];

// ── Tabs ──────────────────────────────────────────
function showTab(name) {
  ['upload','history','dashboard'].forEach((t, i) => {
    document.getElementById('page-' + t).classList.toggle('active', t === name);
    document.querySelectorAll('.tab-btn')[i].classList.toggle('active', t === name);
  });
  if (name === 'history' || name === 'dashboard') {
    fetchReceipts().then(() => {
      if (name === 'history') renderHistory();
      if (name === 'dashboard') renderDashboard();
    });
  }
}

// ── File select ───────────────────────────────────
function onFileSelect(input) {
  selectedFile = input.files[0] || null;
  const dz = document.getElementById('drop-zone');
  dz.classList.toggle('has-file', !!selectedFile);
  document.getElementById('filename').textContent = selectedFile ? selectedFile.name : '';
  document.getElementById('scan-btn').disabled = !selectedFile;
}

// ── Upload & parse ────────────────────────────────
async function scanReceipt() {
  if (!selectedFile) return;
  const btn = document.getElementById('scan-btn');
  const statusBox = document.getElementById('status-box');

  btn.disabled = true;
  btn.textContent = 'Scanning…';
  statusBox.style.display = 'block';
  statusBox.className = 'status-box loading';
  statusBox.textContent = 'Reading your receipt with AI… takes about 10 seconds.';
  document.getElementById('result-area').innerHTML = '';

  try {
    const base64 = await fileToBase64(selectedFile);
    const date = document.getElementById('date-input').value || '';
    const res = await fetch('/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base64, mediaType: selectedFile.type || 'image/jpeg', date }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    statusBox.className = 'status-box success';
    statusBox.textContent = `Done! Found ${data.items.length} items.`;
    renderResult(data);
    receipts.unshift(data);
  } catch (e) {
    statusBox.className = 'status-box error';
    statusBox.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Scan Receipt';
  }
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ── Result card ───────────────────────────────────
function renderResult(receipt) {
  const byCategory = {};
  receipt.items.forEach(i => {
    byCategory[i.category] = (byCategory[i.category] || 0) + i.total_price;
  });

  const pills = Object.entries(byCategory).sort((a,b)=>b[1]-a[1])
    .map(([cat, total]) =>
      `<span class="pill" style="background:${COLORS[cat]||'#999'}">${cat} $${total.toFixed(2)}</span>`
    ).join('');

  const rows = receipt.items.map(item =>
    `<tr>
      <td>${item.name}</td>
      <td><span class="pill" style="background:${COLORS[item.category]||'#999'}">${item.category}</span></td>
      <td>${item.quantity}${item.unit ? ' ' + item.unit : ''}</td>
      <td>$${item.total_price.toFixed(2)}</td>
    </tr>`
  ).join('');

  document.getElementById('result-area').innerHTML = `
    <div class="card">
      <div class="result-header">
        <h3>${receipt.store_name || 'Receipt'}</h3>
        <p>${receipt.purchased_at}${receipt.total_amount != null ? ' · $' + receipt.total_amount.toFixed(2) + ' total' : ''}</p>
      </div>
      <div class="pills-row">${pills}</div>
      <table class="items-table">
        <thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Price</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── Data ──────────────────────────────────────────
async function fetchReceipts() {
  const res = await fetch('/receipts');
  receipts = await res.json();
}

// ── History ───────────────────────────────────────
function renderHistory() {
  const el = document.getElementById('history-list');
  if (!receipts.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🧾</div><p>No receipts yet.<br>Upload one on the Upload tab.</p></div>`;
    return;
  }
  el.innerHTML = receipts.map(r => `
    <div class="hist-item">
      <div>
        <div class="hist-store">${r.store_name || 'Unknown store'}</div>
        <div class="hist-meta">${r.purchased_at} · ${r.items.length} items</div>
      </div>
      <div class="hist-total">${r.total_amount != null ? '$' + r.total_amount.toFixed(2) : '—'}</div>
    </div>`).join('');
}

// ── Dashboard ─────────────────────────────────────
function renderDashboard() {
  const el = document.getElementById('dashboard-content');
  if (!receipts.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><p>No data yet.<br>Scan some receipts and come back here.</p></div>`;
    return;
  }

  const months = {};
  for (const r of receipts) {
    const month = r.purchased_at.slice(0, 7);
    if (!months[month]) months[month] = { spend: 0, byCat: {}, itemMap: {} };
    const m = months[month];
    for (const item of r.items) {
      m.spend += item.total_price;
      m.byCat[item.category] = (m.byCat[item.category] || 0) + item.total_price;
      const key = item.name.toLowerCase().trim();
      if (!m.itemMap[key]) m.itemMap[key] = { cat: item.category, total: 0 };
      m.itemMap[key].total += item.total_price;
    }
  }

  el.innerHTML = Object.entries(months)
    .sort((a,b) => b[0].localeCompare(a[0]))
    .map(([month, data]) => {
      const label = new Date(month + '-02').toLocaleString('en-US', { month: 'long', year: 'numeric' });
      const topItems = Object.entries(data.itemMap)
        .map(([name, v]) => ({ name, ...v }))
        .sort((a,b) => b.total - a.total)
        .slice(0, 20);
      const maxTotal = topItems[0]?.total || 1;

      const catChips = Object.entries(data.byCat).sort((a,b) => b[1]-a[1])
        .map(([cat, total]) =>
          `<div class="cat-chip" style="background:${COLORS[cat]||'#999'}">${cat} &nbsp;$${total.toFixed(2)}</div>`
        ).join('');

      const itemRows = topItems.map(item =>
        `<div class="item-row">
          <div class="item-dot" style="background:${COLORS[item.cat]||'#999'}"></div>
          <div class="item-name">${item.name}</div>
          <div class="bar-wrap">
            <div class="bar" style="background:${COLORS[item.cat]||'#999'};width:${Math.round(item.total/maxTotal*100)}%;opacity:0.75"></div>
          </div>
          <div class="item-amt">$${item.total.toFixed(2)}</div>
        </div>`
      ).join('');

      return `
        <div class="month-card">
          <div class="month-head">
            <h2>${label}</h2>
            <div class="month-total">$${data.spend.toFixed(2)}</div>
          </div>
          <div class="section-title">By category</div>
          <div class="cat-chips">${catChips}</div>
          <div class="section-title">Top items</div>
          <div class="items-body">${itemRows}</div>
        </div>`;
    }).join('');
}
</script>
</body>
</html>
